[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "telco-churn"
version = "0.0.1"
description = "Machine learning project"
authors = [
  { name = "Devaki" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["telco-churn"]
include = ["pyproject.toml", "telco-churn/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["telco-churn"]
force-sort-within-sections = true

[tool.uv.workspace]
members = [
    "telco-churn",
]

